# Server Configuration
server.port=8085

# Application Name
spring.application.name=checkout-api

# Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/checkout
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-test-query=select 1

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# Spring Cloud Stream - Kafka Binder
spring.cloud.stream.kafka.binder.autoCreateTopics=true
spring.cloud.stream.kafka.binder.brokers=localhost:9092

# Consumer funcional (bean paymentPaid)
spring.cloud.function.definition=paymentPaid

# Bindings
spring.cloud.stream.bindings.checkout-created-output.binder=kafka
spring.cloud.stream.bindings.checkout-created-output.destination=streaming.ecommerce.checkout.created
spring.cloud.stream.bindings.checkout-created-output.content-type=application/json

spring.cloud.stream.bindings.paymentPaid-in-0.binder=kafka
spring.cloud.stream.bindings.paymentPaid-in-0.destination=streaming.ecommerce.payment.paid
spring.cloud.stream.bindings.paymentPaid-in-0.group=${spring.application.name}
spring.cloud.stream.bindings.paymentPaid-in-0.content-type=application/json

# Silenciar log de erro conhecido do Hibernate Envers / Metamodel (HHH015007)
logging.level.org.hibernate.metamodel.internal.MetadataContext=OFF